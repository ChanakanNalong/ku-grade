version: "3.9"
services:
  backend:
    build: ./backend
    container_name: ku-grade-backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - DB_HOST=database
      - DB_USER=root
      - DB_PASSWORD="@Kan11113@05110405"
      - DB_NAME=ku-grade
    command: ["/wait-for-it.sh", "database:3306", "--", "node", "server.js"]
    depends_on:
      - database

  frontend:
    build: ./frontend
    container_name: ku-grade-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:5000

  database:
    image: mysql:8.0.43
    container_name: ku-grade-database
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "@Kan11113@05110405"
      MYSQL_DATABASE: ku-grade
    ports:
      - "3306:3306"
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
