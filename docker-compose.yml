version: "3.8"
services:
  frontend:
    build: ./frontend
    ports:
      - "3000:80"   # React serve ผ่าน nginx

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    depends_on:
      - mysql_db
    environment:
      - DB_HOST=mysql_db
      - DB_USER=root
      - DB_PASS=rootpassword
      - DB_NAME=mydb

  mysql_db:
    image: mysql:8
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: mydb
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
